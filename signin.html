<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter the Haus — SE ACÁBÓ</title>
<style>
:root{--black:#050605;--gold:#d6aa50;--gold-light:#f0cd7a;--gold-border:#5d4824;--cream:#f6e9c7;--muted:#c6b78f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;margin:0;background:#010201;color:var(--cream);font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% -12%,#302b1e 0%,#11120e 28%,#060706 60%,#020302 100%)}.app{width:min(100%,440px);padding:22px 0}.brand{text-align:center;margin-bottom:24px}.seal{width:70px;height:70px;display:grid;place-items:center;margin:0 auto 14px;border:1px solid rgba(223,176,73,.75);border-radius:50%;box-shadow:inset 0 0 0 5px #0006,inset 0 0 0 6px #b9893155;color:var(--gold-light);font:italic bold 38px/1 Georgia,'Times New Roman',serif;letter-spacing:-.22em;padding-right:12px}.brand h1{margin:0;color:var(--gold-light);font:normal 25px/1 Georgia,'Times New Roman',serif;letter-spacing:.21em}.brand p{margin:9px 0 0;color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.22em}.panel{padding:24px 20px;background:linear-gradient(145deg,#181914,#0b0c0a);border:1px solid var(--gold-border);border-radius:13px;box-shadow:0 16px 36px #0009}.panel h2{margin:0 0 8px;color:var(--gold-light);font:normal 24px Georgia,'Times New Roman',serif;text-align:center}.panel>p{margin:0 0 22px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}.field{display:grid;gap:7px;margin-bottom:14px}.field label{color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.15em}.field input{width:100%;padding:13px 12px;color:var(--cream);background:#080907;border:1px solid #574523;border-radius:7px;outline:none;font:14px Arial,Helvetica,sans-serif}.field input:focus{border-color:var(--gold-light);box-shadow:0 0 0 2px #f0cd7a22}.primary,.provider,.text-button{width:100%;font-family:Arial,Helvetica,sans-serif;cursor:pointer}.primary{padding:14px;color:#271a07;background:linear-gradient(135deg,#c99537,#f0cd7a);border:1px solid var(--gold-light);border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.13em}.primary:disabled,.provider:disabled{cursor:not-allowed;opacity:.55}.divider{display:flex;gap:12px;align-items:center;margin:20px 0;color:#9d916f;font-size:9px;letter-spacing:.14em}.divider:before,.divider:after{content:'';flex:1;height:1px;background:#4b3b20}.provider{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:10px;padding:13px;color:var(--cream);background:linear-gradient(145deg,#171812,#0d0e0c);border:1px solid var(--gold-border);border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.08em}.provider-mark{width:18px;color:var(--gold-light);font-size:17px;font-weight:bold;text-align:center}.apple{font-size:20px}.text-button{margin-top:17px;padding:5px;color:var(--gold-light);background:none;border:0;font-size:10px;letter-spacing:.08em}.forgot{margin-top:8px;color:var(--muted)}.message{min-height:18px;margin:14px 0 0;color:#e4c078;font-size:11px;line-height:1.4;text-align:center}.message.error{color:#e59684}.loading{pointer-events:none;opacity:.7}.footnote{margin:19px 12px 0;color:#9f9478;font-size:9px;line-height:1.5;text-align:center}@media(max-width:380px){body{padding:16px}.panel{padding:21px 16px}.brand h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header class="brand"><div class="seal">SA</div><h1>SE ACÁBÓ</h1><p>HAUS OF RECOVERY</p></header>
<section class="panel" id="authPanel"><h2>Enter the Haus</h2><p>Access your member pass, recovery ledger and private Haus archive.</p>
<form id="signInForm"><div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button id="signInButton" class="primary" type="submit">SIGN IN</button></form>
<div class="divider">OR CONTINUE WITH</div>
<button id="googleButton" class="provider" type="button"><span class="provider-mark">G</span>CONTINUE WITH GOOGLE</button>
<button id="appleButton" class="provider" type="button"><span class="provider-mark apple">●</span>CONTINUE WITH APPLE</button>
<button id="forgotButton" class="text-button forgot" type="button">FORGOT YOUR PASSWORD?</button>
<button class="text-button" type="button" onclick="window.location.href='signup.html'">NEW TO THE HAUS? CREATE YOUR ACCOUNT</button>
<p id="message" class="message" aria-live="polite"></p></section>
<p class="footnote">Private member access. Recovery continues.</p>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,setPersistence,browserLocalPersistence,GoogleAuthProvider,OAuthProvider,signInWithEmailAndPassword,signInWithPopup,sendPasswordResetEmail,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyDc9zNGMfAWAAWw5NJULTDs558VG6lRXvE",authDomain:"seacabo-47534.firebaseapp.com",projectId:"seacabo-47534",storageBucket:"seacabo-47534.firebasestorage.app",messagingSenderId:"69526242796",appId:"1:69526242796:web:179ee35e8c7a746669acc9",measurementId:"G-WH7ER7NL6W"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),google=new GoogleAuthProvider(),apple=new OAuthProvider('apple.com');
const panel=document.getElementById('authPanel'),message=document.getElementById('message');let redirecting=false;
function say(text,error=false){message.textContent=text;message.classList.toggle('error',error)}function busy(on){panel.classList.toggle('loading',on);document.querySelectorAll('button').forEach(b=>b.disabled=on)}function errorText(error){const errors={'auth/invalid-email':'Enter a valid email address.','auth/invalid-credential':'Your email or password is incorrect.','auth/user-not-found':'Your email or password is incorrect.','auth/wrong-password':'Your email or password is incorrect.','auth/user-disabled':'This account has been disabled.','auth/popup-closed-by-user':'Sign-in was closed before it completed.','auth/popup-blocked':'Your browser blocked the sign-in window. Please allow pop-ups and try again.','auth/unauthorized-domain':'This website domain must be added in Firebase Authentication settings.','auth/account-exists-with-different-credential':'An account already exists with this email using another sign-in method.'};return errors[error.code]||'Something went wrong. Please try again.'}
async function redirectAfterLogin(user){if(redirecting)return;redirecting=true;busy(true);say('Verifying member access…');try{const masterRecord=await getDoc(doc(db,'admins',user.uid));const isMaster=masterRecord.exists()&&masterRecord.data().role==='master';window.location.replace(isMaster?'admin.html':'account.html')}catch(error){window.location.replace('account.html')}}
await setPersistence(auth,browserLocalPersistence).catch(()=>{});onAuthStateChanged(auth,user=>{if(user)redirectAfterLogin(user)});
document.getElementById('signInForm').addEventListener('submit',async event=>{event.preventDefault();busy(true);say('Opening your member account…');try{const credential=await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);redirectAfterLogin(credential.user)}catch(error){say(errorText(error),true);busy(false)}});
document.getElementById('googleButton').onclick=async()=>{busy(true);say('Connecting to Google…');try{const credential=await signInWithPopup(auth,google);redirectAfterLogin(credential.user)}catch(error){say(errorText(error),true);busy(false)}};
document.getElementById('appleButton').onclick=async()=>{busy(true);say('Connecting to Apple…');try{const credential=await signInWithPopup(auth,apple);redirectAfterLogin(credential.user)}catch(error){say(errorText(error),true);busy(false)}};
document.getElementById('forgotButton').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){say('Enter your email address above, then request a password reset.',true);document.getElementById('email').focus();return}busy(true);try{await sendPasswordResetEmail(auth,email);say('Password-reset instructions have been sent.');busy(false)}catch(error){say(errorText(error),true);busy(false)}};
</script>
</body>
</html>
