<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Account — SE ACÁBÓ</title>
<style>
:root{--black:#050605;--gold:#d6aa50;--gold-light:#f0cd7a;--gold-border:#5d4824;--cream:#f6e9c7;--muted:#c6b78f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;margin:0;background:#010201;color:var(--cream);font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% -12%,#302b1e 0%,#11120e 28%,#060706 60%,#020302 100%)}.app{width:min(100%,440px);padding:22px 0}.brand{text-align:center;margin-bottom:24px}.seal{width:70px;height:70px;display:grid;place-items:center;margin:0 auto 14px;border:1px solid rgba(223,176,73,.75);border-radius:50%;box-shadow:inset 0 0 0 5px #0006,inset 0 0 0 6px #b9893155;color:var(--gold-light);font:italic bold 38px/1 Georgia,'Times New Roman',serif;letter-spacing:-.22em;padding-right:12px}.brand h1{margin:0;color:var(--gold-light);font:normal 25px/1 Georgia,'Times New Roman',serif;letter-spacing:.21em}.brand p{margin:9px 0 0;color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.22em}.panel{padding:24px 20px;background:linear-gradient(145deg,#181914,#0b0c0a);border:1px solid var(--gold-border);border-radius:13px;box-shadow:0 16px 36px #0009}.panel h2{margin:0 0 8px;color:var(--gold-light);font:normal 24px Georgia,'Times New Roman',serif;text-align:center}.panel>p{margin:0 0 22px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}.field{display:grid;gap:7px;margin-bottom:14px}.field label{color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.15em}.field input{width:100%;padding:13px 12px;color:var(--cream);background:#080907;border:1px solid #574523;border-radius:7px;outline:none;font:14px Arial,Helvetica,sans-serif}.field input:focus{border-color:var(--gold-light);box-shadow:0 0 0 2px #f0cd7a22}.field input.invalid{border-color:#d27e70;box-shadow:0 0 0 2px #d27e7022}.requirement{margin:-6px 0 14px;color:#aa9c7d;font-size:10px;line-height:1.4}.primary,.provider,.text-button{width:100%;font-family:Arial,Helvetica,sans-serif;cursor:pointer}.primary{padding:14px;color:#271a07;background:linear-gradient(135deg,#c99537,#f0cd7a);border:1px solid var(--gold-light);border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.13em}.primary:disabled,.provider:disabled{cursor:not-allowed;opacity:.55}.divider{display:flex;gap:12px;align-items:center;margin:20px 0;color:#9d916f;font-size:9px;letter-spacing:.14em}.divider:before,.divider:after{content:'';flex:1;height:1px;background:#4b3b20}.provider{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:10px;padding:13px;color:var(--cream);background:linear-gradient(145deg,#171812,#0d0e0c);border:1px solid var(--gold-border);border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.08em}.provider-mark{width:18px;color:var(--gold-light);font-size:17px;font-weight:bold;text-align:center}.apple{font-size:20px}.text-button{margin-top:17px;padding:5px;color:var(--gold-light);background:none;border:0;font-size:10px;letter-spacing:.08em}.message{min-height:18px;margin:14px 0 0;color:#e4c078;font-size:11px;line-height:1.4;text-align:center}.message.error{color:#e59684}.loading{pointer-events:none;opacity:.7}.footnote{margin:19px 12px 0;color:#9f9478;font-size:9px;line-height:1.5;text-align:center}@media(max-width:380px){body{padding:16px}.panel{padding:21px 16px}.brand h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header class="brand"><div class="seal">SA</div><h1>SE ACÁBÓ</h1><p>HAUS OF RECOVERY</p></header>
<section class="panel" id="authPanel"><h2>Create your pass</h2><p>Begin your private member ledger and enter the Haus.</p>
<form id="signUpForm"><div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">CREATE PASSWORD</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div><p class="requirement">Use at least 6 characters.</p><div class="field"><label for="confirmPassword">CONFIRM PASSWORD</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></div><button id="signUpButton" class="primary" type="submit">CREATE MEMBER ACCOUNT</button></form>
<div class="divider">OR CONTINUE WITH</div>
<button id="googleButton" class="provider" type="button"><span class="provider-mark">G</span>CONTINUE WITH GOOGLE</button>
<button id="appleButton" class="provider" type="button"><span class="provider-mark apple">●</span>CONTINUE WITH APPLE</button>
<button class="text-button" type="button" onclick="window.location.href='signin.html'">ALREADY A MEMBER? SIGN IN</button>
<p id="message" class="message" aria-live="polite"></p></section>
<p class="footnote">Your information remains inside your private member ledger.<br>Recovery continues.</p>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,setPersistence,browserLocalPersistence,GoogleAuthProvider,OAuthProvider,createUserWithEmailAndPassword,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyDc9zNGMfAWAAWw5NJULTDs558VG6lRXvE",authDomain:"seacabo-47534.firebaseapp.com",projectId:"seacabo-47534",storageBucket:"seacabo-47534.firebasestorage.app",messagingSenderId:"69526242796",appId:"1:69526242796:web:179ee35e8c7a746669acc9",measurementId:"G-WH7ER7NL6W"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),google=new GoogleAuthProvider(),apple=new OAuthProvider('apple.com');
const panel=document.getElementById('authPanel'),message=document.getElementById('message'),password=document.getElementById('password'),confirmPassword=document.getElementById('confirmPassword');
function say(text,error=false){message.textContent=text;message.classList.toggle('error',error)}function busy(on){panel.classList.toggle('loading',on);document.querySelectorAll('button').forEach(button=>button.disabled=on)}function errorText(error){const errors={'auth/invalid-email':'Enter a valid email address.','auth/email-already-in-use':'An account already exists with this email. Please sign in instead.','auth/weak-password':'Use a password with at least 6 characters.','auth/popup-closed-by-user':'Sign-up was closed before it completed.','auth/popup-blocked':'Your browser blocked the sign-up window. Please allow pop-ups and try again.','auth/unauthorized-domain':'This website domain must be added in Firebase Authentication settings.','auth/account-exists-with-different-credential':'An account already exists with this email using another sign-in method.'};return errors[error.code]||'Something went wrong. Please try again.'}function passwordsMatch(){const match=password.value===confirmPassword.value;confirmPassword.classList.toggle('invalid',confirmPassword.value.length>0&&!match);return match}function memberNumber(uid){let value=0;for(let i=0;i<uid.length;i++)value=(value*31+uid.charCodeAt(i))%1000000;return String(value).padStart(6,'0')}
password.addEventListener('input',passwordsMatch);confirmPassword.addEventListener('input',passwordsMatch);
async function createMemberLedger(user){const reference=doc(db,'users',user.uid),snapshot=await getDoc(reference);if(snapshot.exists())return;await setDoc(reference,{uid:user.uid,email:user.email||null,displayName:user.displayName||null,memberNumber:memberNumber(user.uid),memberSince:new Date().getFullYear(),membershipStatus:'ACTIVE',houseLedger:'SOVEREIGN TIER',notificationPreferences:{vipDropWindows:true,nocturnalReminders:true,hausNotices:true,libraryAcademy:true},createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}
await setPersistence(auth,browserLocalPersistence).catch(()=>{});onAuthStateChanged(auth,user=>{if(user)window.location.replace('account.html')});
document.getElementById('signUpForm').addEventListener('submit',async event=>{event.preventDefault();if(!passwordsMatch()){say('Your passwords do not match. Please try again.',true);confirmPassword.focus();return}busy(true);say('Creating your member account…');try{const credential=await createUserWithEmailAndPassword(auth,document.getElementById('email').value.trim(),password.value);await createMemberLedger(credential.user);window.location.replace('account.html')}catch(error){say(errorText(error),true);busy(false)}});
document.getElementById('googleButton').onclick=async()=>{busy(true);say('Connecting to Google…');try{const credential=await signInWithPopup(auth,google);await createMemberLedger(credential.user);window.location.replace('account.html')}catch(error){say(errorText(error),true);busy(false)}};
document.getElementById('appleButton').onclick=async()=>{busy(true);say('Connecting to Apple…');try{const credential=await signInWithPopup(auth,apple);await createMemberLedger(credential.user);window.location.replace('account.html')}catch(error){say(errorText(error),true);busy(false)}};
</script>
</body>
</html>
