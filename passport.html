<style>
:root{--black:#000;--gold:#c99525;--gold-light:#edc55f;--gold-dark:#76520f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;margin:0;background:var(--black);color:var(--gold-light);font-family:Gotham,'Montserrat','Avenir Next',Arial,sans-serif}body{overflow-x:hidden}.app{width:min(100%,540px);min-height:100vh;margin:auto;padding-bottom:90px;background:#000;border-inline:1px solid #211805}.topbar{height:108px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:18px 24px 6px;border-bottom:1px solid var(--gold-dark)}.hamburger{width:42px;height:42px;padding:8px;border:0;background:transparent;cursor:pointer}.hamburger span{display:block;width:27px;height:3px;margin:4px 0;border-radius:10px;background:var(--gold-light)}.header-title{text-align:center}.header-title h1{margin:0;color:var(--gold-light);font-family:Gotham,'Montserrat','Avenir Next',Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:.24em}.header-title p{margin:7px 0 0;color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.2em}.music-button{width:42px;height:42px;place-self:center end;padding:0;color:var(--gold-light);background:#000;border:1px solid var(--gold);border-radius:50%;cursor:pointer;font-size:18px;line-height:1}.music-button.playing{color:var(--gold-light);background:#000;border-color:var(--gold-light)}.coming{min-height:calc(100vh - 198px);display:grid;place-items:center;padding:30px 22px}.coming-card{width:100%;max-width:410px;min-height:235px;display:grid;place-items:center;padding:34px 25px;text-align:center;background:#000;border:1px solid var(--gold);border-radius:13px}.eyebrow{margin:0 0 17px;color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.24em}.coming h2{margin:0;color:var(--gold-light);font-family:Gotham,'Montserrat','Avenir Next',Arial,sans-serif;font-size:28px;font-weight:700;letter-spacing:.16em;line-height:1.1}.rule{width:80px;height:1px;margin:20px auto;background:var(--gold)}.coming p{max-width:270px;margin:0;color:var(--gold-light);font-size:11px;font-weight:500;letter-spacing:.06em;line-height:1.6}.bottom-nav{position:fixed;z-index:10;bottom:0;left:50%;display:grid;width:min(100%,540px);height:78px;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom);transform:translateX(-50%);background:#000;border-top:1px solid var(--gold-dark)}.bottom-nav a{display:grid;gap:5px;place-content:center;color:var(--gold);text-decoration:none;font-family:Gotham,'Montserrat','Avenir Next',Arial,sans-serif;font-size:8px;font-weight:600;text-align:center}.bottom-nav a.active{color:var(--gold-light)}.bottom-nav .nav-icon{font-size:20px;line-height:1}.menu-layer{position:fixed;z-index:120;inset:0;display:none;background:#000c}.menu-layer.open{display:block}.drawer{width:min(310px,84vw);height:100%;padding:25px 21px;background:#000;border-right:1px solid var(--gold-dark)}.drawer-head{display:flex;justify-content:space-between;margin-bottom:25px}.drawer h3{margin:0;color:var(--gold-light);font-family:Gotham,'Montserrat','Avenir Next',Arial,sans-serif;font-size:20px;letter-spacing:.15em}.drawer button{border:0;background:#000;color:var(--gold-light);font-size:29px;cursor:pointer}.drawer a{display:block;padding:15px 2px;color:var(--gold-light);border-bottom:1px solid var(--gold-dark);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.11em}@media(max-width:360px){.topbar{padding-inline:16px}.coming h2{font-size:24px}.bottom-nav a{font-size:7px}.bottom-nav .nav-icon{font-size:18px}}
</style>
</head>
<body>
<audio id="seacaboJingle" preload="auto"><source src="seacabo_jingle.mp3" type="audio/mpeg"></audio>
<div class="app"><header class="topbar"><button class="hamburger" id="menuButton" type="button" aria-label="Open menu"><span></span><span></span><span></span></button><div class="header-title"><h1>SE ACABÓ</h1><p>HAUS OF RECOVERY</p></div><button id="musicButton" class="music-button" type="button" aria-label="Play Se Acabó jingle" aria-pressed="false">♫</button></header><main class="coming"><section class="coming-card"><div><p class="eyebrow">THE HAUS IS PREPARING</p><h2>COMING SOON</h2></section></main><nav class="bottom-nav" aria-label="Primary navigation"><a href="haus.html"><span class="nav-icon">⌂</span><span>HAUS</span></a><a href="passport.html"><span class="nav-icon">▣</span><span>ARCHIVE</span></a><a href="drops.html"><span class="nav-icon">◷</span><span>DROPS</span></a><a href="passport.html"><span class="nav-icon">♙</span><span>PASSPORT</span></a><a href="library.html"><span class="nav-icon">▦</span><span>LIBRARY</span></a><a href="journal.html"><span class="nav-icon">◩</span><span>JOURNAL</span></a><a href="account.html"><span class="nav-icon">♙</span><span>ACCOUNT</span></a></nav></div>

<script>const menuLayer=document.getElementById('menuLayer');document.getElementById('menuButton').onclick=()=>menuLayer.classList.add('open');document.getElementById('closeMenu').onclick=()=>menuLayer.classList.remove('open');menuLayer.onclick=e=>{if(e.target===menuLayer)menuLayer.classList.remove('open')};const jingle=document.getElementById('seacaboJingle'),music=document.getElementById('musicButton');function updateMusic(){const playing=!jingle.paused;music.textContent=playing?'Ⅱ':'♫';music.classList.toggle('playing',playing);music.setAttribute('aria-pressed',String(playing));music.setAttribute('aria-label',playing?'Pause Se Acabó jingle':'Play Se Acabó jingle')}music.onclick=()=>{if(jingle.paused)jingle.play().catch(()=>{});else jingle.pause()};jingle.onplay=updateMusic;jingle.onpause=updateMusic;jingle.onended=updateMusic;</script>
