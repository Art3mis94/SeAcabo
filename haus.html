<script>const hausJingle=document.getElementById('seacaboJingle'),musicButton=document.getElementById('musicButton');function updateMusicButton(playing){musicButton.textContent=playing?'Ⅱ':'♫';musicButton.classList.toggle('playing',playing);musicButton.setAttribute('aria-pressed',String(playing));musicButton.setAttribute('aria-label',playing?'Pause Se Acabó jingle':'Play Se Acabó jingle')}musicButton.onclick=()=>{if(hausJingle.paused)hausJingle.play().catch(()=>updateMusicButton(false));else hausJingle.pause()};hausJingle.onplay=()=>updateMusicButton(true);hausJingle.onpause=()=>updateMusicButton(false);hausJingle.onended=()=>updateMusicButton(false);const memberCard=document.getElementById('memberCard');memberCard.onclick=()=>memberCard.classList.toggle('flipped');memberCard.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();memberCard.classList.toggle('flipped')}};let remainingSeconds=2*60*60+18*60+47;setInterval(()=>{if(remainingSeconds>0)remainingSeconds--;const h=String(Math.floor(remainingSeconds/3600)).padStart(2,'0'),m=String(Math.floor(remainingSeconds%3600/60)).padStart(2,'0'),s=String(remainingSeconds%60).padStart(2,'0');document.getElementById('countdown').textContent=h+':'+m+':'+s},1000);</script>
